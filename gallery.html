<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Precious Moments - Little Princess</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Great+Vibes&family=Montserrat:wght@300;400;600&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="photo-gallery">
            <div class="back-button">
                <a href="index.html">
                    <i class="fas fa-arrow-left"></i>
                    <span>Back to Welcome</span>
                </a>
            </div>
            <h2 class="section-title">Precious Moments</h2>
            <div class="photo-grid">
                <div class="photo-card">
                    <div class="photo-wrapper">
                        <img src="images/baby1.jpg" alt="Baby's First Photo" onerror="this.src='https://via.placeholder.com/300x300?text=Baby+Photo'">
                    </div>
                    <div class="photo-overlay">
                        <h3 class="photo-label">First Glimpse</h3>
                        <p class="photo-description">Our precious little one's first moments in this world</p>
                    </div>
                </div>
                <div class="photo-card">
                    <div class="photo-wrapper">
                        <img src="images/baby3.jpg" alt="Baby's Second Photo" onerror="this.src='https://via.placeholder.com/300x300?text=Baby+Photo'">
                    </div>
                    <div class="photo-overlay">
                        <h3 class="photo-label">Sweet Dreams</h3>
                        <p class="photo-description">Sleeping peacefully</p>
                    </div>
                </div>
                <div class="photo-card">
                    <div class="photo-wrapper">
                        <img src="images/baby2.jpg" alt="Baby's Third Photo" onerror="this.src='https://via.placeholder.com/300x300?text=Baby+Photo'">
                    </div>
                    <div class="photo-overlay">
                        <h3 class="photo-label">Family Love</h3>
                        <p class="photo-description">Surrounded by love and warmth</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Add celebration particles script -->
    <script src="js/script.js"></script>
</body>
</html>
